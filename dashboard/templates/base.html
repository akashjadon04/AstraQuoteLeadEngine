<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstraQuote Lead Engine | Evolnex</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    
    <div class="sidebar">
        <div class="brand">Evolnex</div>
        
        <nav>
            <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mr-2" style="margin-right:10px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Overview
            </a>
            <a href="{{ url_for('leads') }}" class="nav-link {% if request.endpoint == 'leads' %}active{% endif %}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mr-2" style="margin-right:10px;"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Leads
            </a>
            <a href="{{ url_for('export_panel') }}" class="nav-link {% if request.endpoint == 'export_panel' %}active{% endif %}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mr-2" style="margin-right:10px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Export
            </a>
        </nav>
        
        <!-- Dual Scraper Profile Switcher in Sidebar -->
        <div style="margin-top: 1rem; padding: 1rem; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;">
            <div style="font-size: 0.72rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; display: flex; align-items: center; justify-content: space-between;">
                <span>Niche Profile</span>
                <span id="sidebarProfileIcon" style="font-size: 0.9rem;">🔧</span>
            </div>
            <button id="btnSidebarPlumbing" onclick="switchNicheProfile('plumbing_hvac')" style="width: 100%; text-align: left; padding: 9px 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #3b82f6; background: #3b82f6; color: #fff; font-weight: 600; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s;">
                <span>🔧</span> Plomberie & Chauffage
            </button>
            <button id="btnSidebarPergolas" onclick="switchNicheProfile('pergolas_awnings')" style="width: 100%; text-align: left; padding: 9px 12px; border-radius: 8px; border: 1px solid #f59e0b; background: transparent; color: #fbbf24; font-weight: 600; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s;">
                <span>☀️</span> Pergolas & Stores
            </button>
        </div>

        <!-- International Country Selector in Sidebar -->
        <div style="margin-top: 1rem; padding: 1rem; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;">
            <div style="font-size: 0.72rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between;">
                <span>Target Country</span>
                <span id="sidebarCountryFlag">🇺🇸</span>
            </div>
            <select id="countrySelectSidebar" onchange="switchCountryProfile(this.value)" style="width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(15, 23, 42, 0.9); color: #fff; font-weight: 600; font-size: 0.82rem; cursor: pointer;">
                <option value="US">🇺🇸 United States</option>
                <option value="GB">🇬🇧 United Kingdom</option>
                <option value="CA">🇨🇦 Canada</option>
                <option value="AU">🇦🇺 Australia</option>
                <option value="CH">🇨🇭 Switzerland</option>
            </select>
        </div>

        <div style="margin-top: auto; padding-top: 2rem; text-align: center; font-size: 0.8rem; color: var(--text-muted);">
            AstraQuote Lead Engine<br>
            v1.0.0
        </div>
    </div>

    
    <div class="main-content">
        <!-- Dual Scraper Niche & Country Switcher Bar -->
        <div class="top-profile-bar" style="background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 20px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 1rem; font-weight: 700; color: #fff;">Active Target Market:</span>
                <span id="activeCountryBadge" style="background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 4px 14px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; border: 1px solid rgba(16, 185, 129, 0.3);">
                    🇺🇸 USA
                </span>
                <span id="activeProfileBadge" style="background: rgba(59,130,246,0.2); color: #60a5fa; padding: 4px 14px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; border: 1px solid rgba(59,130,246,0.3);">
                    Loading profile…
                </span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="btnProfilePlumbing" onclick="switchNicheProfile('plumbing_hvac')" style="background: #3b82f6; border: 1px solid #3b82f6; color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s;">
                    🔧 Plomberie & Chauffage (NOGA 43.22)
                </button>
                <button id="btnProfilePergolas" onclick="switchNicheProfile('pergolas_awnings')" style="background: transparent; border: 1px solid #f59e0b; color: #fbbf24; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s;">
                    ☀️ Pergolas & Stores (Quote Engine)
                </button>
            </div>
        </div>

        {% block content %}{% endblock %}
    </div>

    <script>
        async function fetchCurrentProfile() {
            try {
                const res = await fetch('/api/profile');
                if (res.ok) {
                    const profile = await res.json();
                    updateProfileUI(profile);
                }
                const cres = await fetch('/api/country');
                if (cres.ok) {
                    const country = await cres.json();
                    updateCountryUI(country);
                }
            } catch(e) { console.error(e); }
        }

        function updateCountryUI(country) {
            const badge = document.getElementById('activeCountryBadge');
            if (badge) badge.innerText = `${country.flag_emoji} ${country.display_name}`;
            const flag = document.getElementById('sidebarCountryFlag');
            if (flag) flag.innerText = country.flag_emoji;
            const select = document.getElementById('countrySelectSidebar');
            if (select) select.value = country.country_code;
        }

        function updateProfileUI(profile) {
            const badge = document.getElementById('activeProfileBadge');
            if (badge) {
                badge.innerText = `${profile.icon} ${profile.display_name}`;
            }
            const sideIcon = document.getElementById('sidebarProfileIcon');
            if (sideIcon) sideIcon.innerText = profile.icon;

            const btnPlumb = document.getElementById('btnProfilePlumbing');
            const btnPerg = document.getElementById('btnProfilePergolas');
            const sidePlumb = document.getElementById('btnSidebarPlumbing');
            const sidePerg = document.getElementById('btnSidebarPergolas');

            if (profile.profile_id === 'pergolas_awnings') {
                if (btnPerg) { btnPerg.style.background = '#f59e0b'; btnPerg.style.color = '#000'; }
                if (btnPlumb) { btnPlumb.style.background = 'transparent'; btnPlumb.style.color = '#94a3b8'; btnPlumb.style.border = '1px solid #334155'; }
                if (sidePerg) { sidePerg.style.background = '#f59e0b'; sidePerg.style.color = '#000'; }
                if (sidePlumb) { sidePlumb.style.background = 'transparent'; sidePlumb.style.color = '#94a3b8'; sidePlumb.style.border = '1px solid #334155'; }
            } else {
                if (btnPlumb) { btnPlumb.style.background = '#3b82f6'; btnPlumb.style.color = '#fff'; btnPlumb.style.border = '1px solid #3b82f6'; }
                if (btnPerg) { btnPerg.style.background = 'transparent'; btnPerg.style.color = '#fbbf24'; btnPerg.style.border = '1px solid #f59e0b'; }
                if (sidePlumb) { sidePlumb.style.background = '#3b82f6'; sidePlumb.style.color = '#fff'; sidePlumb.style.border = '1px solid #3b82f6'; }
                if (sidePerg) { sidePerg.style.background = 'transparent'; sidePerg.style.color = '#fbbf24'; sidePerg.style.border = '1px solid #f59e0b'; }
            }
        }


        async function switchNicheProfile(profileId) {
            try {
                const res = await fetch('/api/profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profile_id: profileId })
                });
                if (res.ok) {
                    const data = await res.json();
                    updateProfileUI(data.active_profile);
                    window.location.reload();
                }
            } catch(e) { console.error(e); }
        }

        async function switchCountryProfile(countryCode) {
            try {
                const res = await fetch('/api/country', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ country_code: countryCode })
                });
                if (res.ok) {
                    const data = await res.json();
                    updateCountryUI(data.active_country);
                    window.location.reload();
                }
            } catch(e) { console.error(e); }
        }

        document.addEventListener('DOMContentLoaded', fetchCurrentProfile);

    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
