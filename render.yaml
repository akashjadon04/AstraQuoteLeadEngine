services:
  - type: web
    name: astraquote-lead-engine
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    region: singapore
    envVars:
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RENDER
        value: "1"                  # Disables pipeline — dashboard viewer only
      - key: SYNC_TOKEN
        value: "astraquote-sync-2024"  # Token for local → Render DB sync
    healthCheckPath: /
    autoDeploy: true
