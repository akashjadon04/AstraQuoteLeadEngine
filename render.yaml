services:
  - type: web
    name: astraquote-lead-engine
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    region: singapore
    envVars:
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RENDER
        value: "1"                  # Activates low-mem mode: concurrency 2/3, no SHAB, no review search
      - key: RESEARCH_CONCURRENCY
        value: "2"                  # 2 parallel crawls max (was 10) — fits in 512MB
      - key: ENRICH_CONCURRENCY
        value: "3"                  # 3 parallel enrichments max (was 20)
    healthCheckPath: /
    autoDeploy: true
