services:
  - type: web
    name: astraquote-lead-engine
    runtime: docker
    dockerfilePath: ./Dockerfile.render   # Lightweight build — no pipeline, no weasyprint
    plan: free
    region: singapore
    envVars:
      - key: DASHBOARD_HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /
    autoDeploy: true
