# fly.toml — AstraQuote Lead Engine
# Fly.io free tier: 3 shared-cpu-1x VMs, 256MB RAM, NEVER sleeps
# https://fly.io/docs/reference/configuration/

app = "astraquote-lead-engine"
primary_region = "cdg"  # Paris — closest to Switzerland

[build]
  dockerfile = "Dockerfile"

[env]
  DASHBOARD_HOST = "0.0.0.0"
  DASHBOARD_PORT = "8800"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8800
  force_https = true
  auto_stop_machines = false   # NEVER sleep
  auto_start_machines = true
  min_machines_running = 1     # Always 1 machine running 24/7

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "astraquote_data"
  destination = "/app/data"
  initial_size = "1gb"
