[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/app/logs

[program:pipeline]
command=python main.py --vps-mode
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/app/logs/pipeline.log
stderr_logfile=/app/logs/pipeline_err.log
stdout_logfile_maxbytes=10MB
environment=PYTHONUNBUFFERED=1,DASHBOARD_HOST=0.0.0.0,DASHBOARD_PORT=8800

[program:dashboard]
command=python -c "
import sys, os
sys.path.insert(0, '/app')
from utils.database import init_db
init_db()
from dashboard.server import create_app
app = create_app()
app.run(host='0.0.0.0', port=8800, debug=False, use_reloader=False)
"
directory=/app
autostart=true
autorestart=true
startretries=5
stdout_logfile=/app/logs/dashboard.log
stderr_logfile=/app/logs/dashboard_err.log
stdout_logfile_maxbytes=10MB
environment=PYTHONUNBUFFERED=1,DASHBOARD_HOST=0.0.0.0,DASHBOARD_PORT=8800
